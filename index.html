<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-title"> 
                <img src="icons/manjaro.svg" alt="" width="30px" height="30px">
                <p>Dashboard</p>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-item">
                    <img src="icons/home.svg" alt="" >
                    <span>Home</span>
                </div>
                <div class="sidebar-item">
                    <img src="icons/card-account-details-outline.svg" alt="">
                    <span>Profile</span>
                </div>
                <div class="sidebar-item">
                    <img src="icons/message-reply.svg" alt="">
                    <span>Messages</span>
                </div>
                <div class="sidebar-item">
                    <img src="icons/clock-time-three-outline.svg" alt="">
                    <span>History</span>
                </div>
                <div class="sidebar-item">
                    <img src="icons/file-multiple.svg" alt="">
                    <span>Tasks</span>
                </div>
                <div class="sidebar-item">
                    <img src="icons/human-greeting-proximity.svg" alt="">
                    <span>Communities</span>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-item">
                    <img src="icons/cog.svg" alt="">
                    <span>Settings</span>
                </div>
                <div class="sidebar-item">
                    <img src="icons/help-box (1).svg" alt="">
                    <span>Support</span>
                </div>
                <div class="sidebar-item">
                    <img src="icons/marker-check.svg" alt="">
                    <span>Privacy</span>
                </div>
            </div>

        </div>
        <div class="header">
            <div class="top-header">
                <div class="left-top">
                    <img src="icons/magnify.svg" class="search" alt="">
                    <input type="text" readonly>
                </div>
                <div class="right-top">
                    <img src="icons/bell-ring-outline.svg   " class="ring" alt="">
                    <div class="image">
                    </div>
                    <span>Morgen oakly</span>
                </div>
            </div>
            <div class="bottom-header">
                <div class="left-bottom">
                    <div class="img-bottom"></div>
                    <div class="text">
                        <p>Hi there,</p>
                        <h1>Morgan Oaklet(@morgan)</h1>
                    </div>
                </div>
                <div class="right-bottom">
                    <button class="btn-header">New</button>
                    <button class="btn-header">Upload</button>
                    <button class="btn-header">Share</button>
                </div>
            </div>
        </div>
        <div class="main-content"></div>
    </div>
</body>
</html>
